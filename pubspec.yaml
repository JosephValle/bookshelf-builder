name: bookshelf_builder
description: "Plan a built-in bookshelf around a window: elevation drawing, cut list and sheet count."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  equatable: ^3.0.0 # Value equality for domain models and cubit states
  flutter:
    sdk: flutter # The app framework
  flutter_bloc: ^9.1.1 # State management (cubits)
  freezed_annotation: ^3.1.0 # Annotations for the generated immutable models
  json_annotation: ^4.12.0 # Annotations for the generated JSON code
  pdf: ^3.13.1 # Builds the printable PDF document
  printing: ^5.15.1 # Opens the print and save dialog for the PDF
  shared_preferences: ^2.5.5 # Saves the last inputs so a refresh keeps them

dev_dependencies:
  bloc_test: ^10.0.0 # Cubit test helpers (blocTest)
  build_runner: ^2.16.1 # Runs the code generators (dart run build_runner build)
  flutter_lints: ^6.0.0 # Recommended lint set (see analysis_options.yaml)
  flutter_test:
    sdk: flutter # Widget and unit test framework
  freezed: ^4.0.1 # Generates copyWith, equality and toString for the models
  json_serializable: ^6.14.1 # Generates toJson/fromJson for the saved inputs

flutter:

  uses-material-design: true
